name: Semantic Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Create Semantic Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Build Provider Binary
        run: |
          VERSION=${{ steps.tag_version.outputs.new_tag }}
          # Strip 'v' prefix if present for binary name
          CLEAN_VERSION=${VERSION#v}
          go build -ldflags="-X main.version=${CLEAN_VERSION}" -o terraform-provider-unitf_v${CLEAN_VERSION}
          echo "BINARY_PATH=terraform-provider-unitf_v${CLEAN_VERSION}" >> $GITHUB_ENV

      - name: Generate SLSA Build Level 3 Provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.BINARY_PATH }}

      - name: Create a GitHub release
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          artifacts: ${{ env.BINARY_PATH }}
